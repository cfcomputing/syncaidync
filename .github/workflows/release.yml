name: Release

# Pushing a v* tag builds the binaries and attaches them to a draft release.
# Running it by hand builds and checks the binaries without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            asset: syncaidync-macos-universal
          - runner: ubuntu-latest
            asset: syncaidync-linux-x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            asset: syncaidync-linux-aarch64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          # rust-toolchain.toml names the version; this installs it with its components.
          rustup toolchain install
          rustc --version
      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked -p syncaidync --target aarch64-apple-darwin
          cargo build --release --locked -p syncaidync --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/syncaidync \
            target/aarch64-apple-darwin/release/syncaidync \
            target/x86_64-apple-darwin/release/syncaidync
          codesign --force --sign - dist/syncaidync
          lipo -info dist/syncaidync
      - name: Build (Linux, static)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq musl-tools
          rustup target add "${{ matrix.target }}"
          cargo build --release --locked -p syncaidync --target "${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/syncaidync" dist/syncaidync
          file dist/syncaidync
      - name: Smoke test and package
        run: |
          dist/syncaidync --version
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          tar -C dist -czf "${{ matrix.asset }}.tar.gz" syncaidync LICENSE THIRD_PARTY_NOTICES.md
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256"
          fi
          cat "${{ matrix.asset }}.tar.gz.sha256"
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "SyncAiDync $GITHUB_REF_NAME" --notes "See CHANGELOG.md." ||
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            "${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}.tar.gz.sha256"
    permissions:
      contents: write
