[package]
name = "syncaidync"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local board for AI coding agents"
publish = false

[lib]
name = "syncaidync"
path = "src/lib.rs"

[[bin]]
name = "syncaidync"
path = "src/main.rs"

[dependencies]
syncaidync-core = { path = "../syncaidync-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal", "fs"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pty-process = { version = "0.5", features = ["async"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
include_dir = "0.7"
getrandom = "0.3"
sha2 = "0.10"
libc = "0.2"
bytes = "1"

[dev-dependencies]
pty-process = { version = "0.5", features = ["async"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal", "fs"] }
serde_json = "1"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
bytes = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"

